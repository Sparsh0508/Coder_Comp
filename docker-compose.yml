services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/codecamp_arena
      CODE_RUNNER_URL: http://code-runner:5001
    depends_on:
      - mongo
      - code-runner
    ports:
      - "8080:8080"

  client:
    build:
      context: ./client
    env_file:
      - ./client/.env
    depends_on:
      - server
    ports:
      - "4173:4173"

  code-runner:
    build:
      context: ./code-runner
    ports:
      - "5001:5001"

volumes:
  mongo_data:
